<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">공유 플랫폼의 테넌트별 접근 경계</title>
<desc id="desc">테넌트 A와 B의 요청은 서버의 인증과 테넌트 범위 권한 검증을 거쳐 각각 허용된 자원에만 접근한다. 논리적 분리 개념도이며 물리 자원 전용 여부는 정하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657d"/></marker></defs>
<rect width="1100" height="610" rx="20" fill="#f5f7fb"/>
<g font-family="Malgun Gothic, sans-serif" fill="#172c46">
<text x="48" y="56" font-size="28" font-weight="700">서비스를 함께 써도 자원 접근 경계는 유지한다</text>
<text x="48" y="91" font-size="17" fill="#52657d">로그인 성공과 테넌트 격리는 서로 다른 조건이다</text>
<rect x="34" y="123" width="1032" height="388" rx="16" fill="#edf1f7" stroke="#ccd5e2"/>
<text x="58" y="157" font-size="18" fill="#52657d">공유 서비스 플랫폼</text>
<g stroke="#7aa0d0" fill="#e6efff"><rect x="64" y="198" width="237" height="104" rx="12"/><rect x="800" y="198" width="237" height="104" rx="12"/></g>
<g stroke="#68a68f" fill="#e3f4ee"><rect x="64" y="358" width="237" height="104" rx="12"/><rect x="800" y="358" width="237" height="104" rx="12"/></g>
<rect x="396" y="198" width="308" height="264" rx="14" fill="#fff" stroke="#b7c6d9" stroke-width="2"/>
<g text-anchor="middle" font-size="23" font-weight="700"><text x="182" y="241">테넌트 A의 사용자</text><text x="182" y="401">테넌트 B의 사용자</text><text x="918" y="241">A에 허용된 자원</text><text x="918" y="401">B에 허용된 자원</text></g>
<g text-anchor="middle" font-size="16" fill="#52657d"><text x="182" y="272">A의 조직·역할 맥락</text><text x="182" y="432">B의 조직·역할 맥락</text><text x="918" y="272">데이터·VM·스토리지 등</text><text x="918" y="432">데이터·VM·스토리지 등</text></g>
<g text-anchor="middle"><text x="550" y="250" font-size="23" font-weight="700">서버 측 검증</text><text x="550" y="294" font-size="19">신원 확인</text><text x="550" y="331" font-size="19">역할과 작업 권한</text><text x="550" y="368" font-size="19">대상 자원의 테넌트 범위</text><text x="550" y="420" font-size="16" fill="#52657d">요청의 테넌트 ID만 믿지 않는다</text></g>
<g stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"><path d="M311 252 H379"/><path d="M311 412 H379"/><path d="M714 252 H783"/><path d="M714 412 H783"/></g>
<text x="48" y="549" font-size="17" fill="#52657d">다른 테넌트의 자원에 접근하는 요청은 차단한다.</text>
<text x="48" y="582" font-size="16" fill="#52657d">BOwiki 개념도 · 논리적 접근 경계이며, 물리 서버·디스크의 전용 배치를 뜻하지 않는다.</text>
</g></svg>
